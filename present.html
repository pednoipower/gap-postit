<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ชิ้นส่วนที่หายไป — projector</title>
<link rel="stylesheet" href="assets/theme.css?v=202609220915">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧩</text></svg>">
<style>
  .title-grid { display:grid; grid-template-columns: 1.25fr .75fr; gap:5vw; align-items:center; height:100%; }
  .qr-card { background:#fff; border-radius:26px; padding:26px; box-shadow:var(--shadow-3); }
  .qr-card svg { display:block; width:100%; height:auto; }
  .join-line { margin-top:20px; text-align:center; }
  .join-line .url { font-size:clamp(15px,1.5vw,25px); color:#C4CCDD; word-break:break-all; }
  .join-line .code {
    font-size:clamp(34px,4.6vw,76px); font-weight:800; letter-spacing:.2em;
    margin-top:6px; color:#fff;
  }
  .joined {
    display:flex; align-items:baseline; gap:16px; margin-top:4vh;
    font-size:clamp(17px,1.9vw,32px); color:#9BA6BC;
  }
  .joined b { font-size:clamp(40px,5.4vw,92px); color:#fff; font-weight:800; letter-spacing:-.03em; }

  .who-grid { display:flex; gap:4vw; height:100%; align-items:center; justify-content:center; flex-wrap:wrap; }
  .who-col { text-align:center; }
  .who-col .n { font-size:clamp(54px,8vw,150px); font-weight:800; line-height:1; letter-spacing:-.04em; }
  .who-col .l { font-size:clamp(16px,1.7vw,29px); color:#9BA6BC; margin-top:10px; }
  .who-roles { display:flex; gap:22px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .who-roles span { font-size:clamp(13px,1.15vw,20px); color:#7D879C; }

  .toolbar {
    position:fixed; top:2vh; right:2vw; display:flex; gap:8px; z-index:20;
    opacity:.12; transition:opacity .2s;
  }
  .toolbar:hover { opacity:1; }
  .toolbar button {
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
    color:#fff; border-radius:9px; padding:8px 13px; font:inherit; font-size:13px; cursor:pointer;
  }
  .toolbar button[aria-pressed="true"] { background:#fff; color:var(--ink); }

  .more-chip {
    /* sits above the room-code chip in the corner rather than on top of it */
    position:absolute; right:0; bottom:54px;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
    border-radius:100px; padding:9px 18px; font-size:clamp(13px,1.2vw,21px); color:#C4CCDD;
  }

  /* The cards shrink as more problem groups arrive, so 8 groups still fit on
     one projected screen. You cannot scroll a projector. */
  .problems { display:grid; gap:1.6vh; height:100%; align-content:center; padding-bottom:6vh; }
  /* grouped view: every problem is a jigsaw piece, laid out in a grid */
  .problems.pieces { grid-template-columns: repeat(var(--cols, 2), 1fr); grid-auto-rows: minmax(0, 1fr);
    gap: 1vh 1vw; align-items: stretch; align-content: stretch; padding-bottom: 1vh; }
  .problem-piece { position: relative; min-height: 0; min-width: 0; display: grid; place-items: center; overflow: hidden; }
  .problem-piece svg { display: block; }
  .spot-problem svg { width: 100%; height: 100%; }
  .problems[data-n="6"] .stmt, .problems[data-n="7"] .stmt { font-size:clamp(15px,1.72vw,30px); }
  .problems[data-n="8"] .stmt, .problems[data-n="9"] .stmt,
  .problems[data-n="10"] .stmt { font-size:clamp(14px,1.5vw,26px); }
  .problems[data-n="8"] .problem-card, .problems[data-n="9"] .problem-card,
  .problems[data-n="10"] .problem-card { padding:1.4vh 2vw; }
  .problem-card {
    display:grid; grid-template-columns:auto 1fr auto; gap:2vw; align-items:center;
    background:#161C2A; border:1px solid #2A3142; border-radius:20px;
    padding:2.2vh 2.4vw;
  }
  .problem-card .tag {
    font-size:clamp(12px,1vw,18px); font-weight:800; letter-spacing:.09em;
    padding:7px 13px; border-radius:8px; color:#0E1118;
  }
  .problem-card .stmt { font-size:clamp(17px,2vw,36px); font-weight:700; line-height:1.22; }
  .problem-card .from { font-size:clamp(12px,1.05vw,19px); color:#8A94A8; margin-top:8px; }
  .problem-card .counts { text-align:right; font-size:clamp(12px,1.05vw,19px); color:#8A94A8; white-space:nowrap; }
  .problem-card .counts b { display:block; font-size:clamp(24px,2.6vw,46px); color:#fff; letter-spacing:-.02em; }

  .spotlight-wrap { display:grid; grid-template-columns: 1fr 1.15fr; gap:3vw; height:100%; align-items:center; }
  .spot-problem { position:relative; height:70%; }
  .spot-solutions { position:relative; height:100%; overflow:hidden; }

  .closing { display:grid; place-items:center; height:100%; text-align:center; }
  .closing .big { font-size:clamp(32px,5vw,90px); font-weight:800; letter-spacing:-.03em; line-height:1.08; }
  .closing .sub { font-size:clamp(16px,1.8vw,31px); color:#9BA6BC; margin-top:2.4vh; }

  .offline-flag {
    position:fixed; top:2vh; left:2vw; z-index:30;
    background:#C94A3F; color:#fff; border-radius:100px;
    padding:9px 18px; font-size:15px; font-weight:650;
  }

  /* ---- react slide: blind while collecting, two columns once revealed ---- */
  .react-blind { display:grid; grid-template-columns: 1.05fr .95fr; gap:3vw; height:100%; align-items:center; }
  .react-blind .piece { position:relative; height:78%; }
  .react-blind .count { text-align:center; }
  .react-blind .count .n { font-size:clamp(70px,11vw,220px); font-weight:800; line-height:1; letter-spacing:-.04em; }
  .react-blind .count .l { font-size:clamp(16px,1.8vw,30px); color:#9BA6BC; margin-top:1vh; }
  .react-blind .count .split { display:flex; gap:3vw; justify-content:center; margin-top:2.4vh; font-size:clamp(14px,1.4vw,24px); color:#7D879C; }
  .react-blind .count .split b { font-size:1.5em; display:block; }
  .react-reveal { display:grid; grid-template-columns: .72fr 1fr 1fr; gap:2vw; height:100%; }
  .react-reveal .piece { position:relative; align-self:center; height:70%; }
  .react-reveal .col { display:flex; flex-direction:column; min-height:0; }
  .react-reveal .col h3 { margin:0 0 1vh; font-size:clamp(16px,1.7vw,30px); font-weight:750; display:flex; align-items:baseline; gap:.6em; }
  .react-reveal .col h3 span { font-size:.7em; color:#8A94A8; font-weight:600; }
  .react-reveal .col .board { position:relative; flex:1; }
  .react-reveal.two { grid-template-columns: .72fr 2fr; }
  .react-reveal .col.causes h3 { color:#E5CE7A; }
  .react-reveal .col.works h3  { color:#8FCFA8; }
  .react-reveal .col.fixes h3  { color:#8FCFA8; }
  .signup { display:flex; align-items:center; gap:2vw; justify-content:center; margin-top:4vh; }
  .signup .qr { background:#fff; border-radius:16px; padding:12px; width:clamp(110px,12vw,200px); }
  .signup .qr svg { display:block; width:100%; height:auto; }
  .signup .l { font-size:clamp(14px,1.5vw,26px); color:#9BA6BC; max-width:26ch; text-align:left; }
</style>
</head>
<body class="present">

<div class="toolbar">
  <button id="tView" aria-pressed="false">Word cloud</button>
  <button id="tFull">Full screen</button>
</div>

<div id="offline" class="offline-flag hidden">ขาดการเชื่อมต่อ — กำลังลองใหม่</div>

<!-- slides are created by script so the sequence follows your config -->
<div id="slides"></div>

<div class="corner-code" id="cornerCode"></div>
<div class="livecount" id="liveCount"><span class="pip"></span><span>0</span></div>

<script src="assets/version.js?v=202609220915"></script>
<script src="assets/config.js?v=202609220915"></script>
<script src="assets/strings.js?v=202609220915"></script>
<script src="assets/slides.js?v=202609220915"></script>
<script src="assets/qrcode.js?v=202609220915"></script>
<script src="assets/jigsaw.js?v=202609220915"></script>
<script src="assets/wordcloud.js?v=202609220915"></script>
<script src="assets/store-supabase.js?v=202609220915"></script>
<script src="assets/store-local.js?v=202609220915"></script>
<script src="assets/store.js?v=202609220915"></script>
<script>
(function () {
  "use strict";
  const cfg = window.CONFIG;
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const t = window.T.t;

  $("tView").textContent = t("pj_word_cloud");
  $("tFull").textContent = t("pj_fullscreen");

  /* ------------------------------------------------------------------------
     THE SLIDE SEQUENCE — shared with the control panel (assets/slides.js).
     Here each slide also gets its builder.
     ---------------------------------------------------------------------- */
  const SLIDES = Slides.build(cfg);
  const BUILDERS = { title: buildTitle, who: buildWho, evidence: buildEvidence, closing: buildClosing };
  SLIDES.forEach(s => { s.build = s.gapId ? buildGap : BUILDERS[s.key]; });
  window.SLIDES = SLIDES;

  let current = -1, viewMode = "wall";
  const els = [];
  SLIDES.forEach(s => {
    const d = document.createElement("section");
    d.className = "slide";
    d.dataset.key = s.key;
    $("slides").appendChild(d);
    els.push(d);
  });

  function show(i) {
    i = Math.max(0, Math.min(SLIDES.length - 1, i));
    if (i === current) { refreshSlide(); return; }
    current = i;
    els.forEach((e, n) => e.classList.toggle("live", n === i));
    $("cornerCode").style.display = SLIDES[i].key === "title" ? "none" : "";
    els[i].replaceChildren();
    SLIDES[i].build(els[i], SLIDES[i]);
    refreshSlide();
  }

  const gapById = id => (Store.state.groups || []).find(g => g.id === id);
  const gapIndex = id => (Store.state.groups || []).findIndex(g => g.id === id);

  /* ---- slide: title, QR, room code ---- */
  function buildTitle(el) {
    el.innerHTML = `
      <div class="title-grid">
        <div>
          <h1>${escapeHtml(cfg.workshopTitle)}</h1>
          <p class="sub" style="max-width:24ch">${escapeHtml(cfg.workshopSubtitle)}</p>
          <div class="joined"><b id="joinN">0</b><span>${escapeHtml(t("pj_in_room"))}</span></div>
        </div>
        <div>
          <div class="qr-card" id="qrBox"></div>
          <div class="join-line">
            <div class="url">${escapeHtml(cfg.joinUrl.replace(/^https?:\/\//, ""))}</div>
            <div class="code">${escapeHtml(cfg.roomCode)}</div>
          </div>
        </div>
      </div>`;
    try { $("qrBox").innerHTML = QRCode.toSVG(cfg.joinUrl, { level: "M", quietZone: 1 }); }
    catch (e) { $("qrBox").innerHTML = `<div style="color:#8C2E25;font-size:15px;padding:12px">QR: ${escapeHtml(e.message)}</div>`; }
  }

  /* ---- slide: who is in the room ---- */
  function buildWho(el) {
    el.innerHTML = `
      <div class="slide-head"><h2>${escapeHtml(t("pj_who"))}</h2>
        <p class="sub">${escapeHtml(t("pj_who_sub"))}</p></div>
      <div class="slide-body"><div class="who-grid" id="whoGrid"></div></div>`;
  }
  function fillWho() {
    const grid = $("whoGrid");
    if (!grid) return;
    const ps = Store.state.participants || [];
    grid.replaceChildren();
    for (const d of cfg.disciplines) {
      const mine = ps.filter(p => p.discipline === d.id);
      const col = document.createElement("div");
      col.className = "who-col";
      const c = (cfg.colors[d.id] || cfg.colors.fallback);
      const roles = cfg.roles.map(r => {
        const n = mine.filter(p => p.role === r.id).length;
        return n ? `<span>${escapeHtml(r.label)} ${n}</span>` : "";
      }).filter(Boolean).join("");
      col.innerHTML =
        `<div class="n" style="color:${c.base}">${mine.length}</div>
         <div class="l">${escapeHtml(d.label)}</div>
         <div class="who-roles">${roles}</div>`;
      grid.appendChild(col);
    }
  }

  /* ---- slide: the gaps from the evidence, as pieces ---- */
  function buildEvidence(el) {
    el.innerHTML = `
      <div class="slide-head"><h2>${escapeHtml(t("pj_evidence"))}</h2>
        <p class="sub">${escapeHtml(t("pj_evidence_sub"))}</p></div>
      <div class="slide-body" style="overflow:hidden"><div class="problems" id="problemList"></div></div>`;
  }

  const GROUP_PALETTE = ["#7FB3D5","#E9A06B","#8FCFA8","#C59BD1","#E5CE7A","#84C5C5","#E39A9A","#A9A3D8"];
  function groupColor(i) { return GROUP_PALETTE[Math.max(0, i) % GROUP_PALETTE.length]; }

  /* One gap as a jigsaw piece: label, problem, the proposal, and counts.
     Drawn at a nominal size and scaled by the browser. */
  function problemPiece(g, i, opts) {
    opts = opts || {};
    const W = 440, H = opts.tall ? 320 : 260;
    const st = Store.state;
    const rs = st.solutions.filter(x => x.group_id === g.id);
    const helps = rs.filter(x => x.kind === "cause" || x.kind === "works").length;
    const needs = rs.filter(x => x.kind === "asset" || x.kind === "idea").length;
    const ideas = 0;
    const accent = groupColor(i);
    const { svg } = Jigsaw.problemSVG({ width: W, height: H, accent });
    const txt = (str, x, y, size, fill, weight, anchor) => {
      const e = document.createElementNS(NS, "text");
      e.setAttribute("x", x); e.setAttribute("y", y);
      e.setAttribute("font-size", size); e.setAttribute("fill", fill);
      e.setAttribute("font-weight", weight || 600);
      if (anchor) e.setAttribute("text-anchor", anchor);
      e.setAttribute("font-family", 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif');
      e.textContent = str; svg.appendChild(e);
    };
    /* The label is the headline (it is a full sentence now), the survey
       number sits under it in the accent colour, and the proposal below. The
       longer problem statement lives on the phone and in the export. */
    txt(g.id, W * 0.13, H * 0.19, 14, accent, 800);
    const counts = opts.blind ? "" : `${helps} · ${needs}` + (ideas ? ` · ${ideas}` : "");
    if (counts) txt(counts, W * 0.87, H * 0.19, 14, "#8A94A8", 600, "end");
    Jigsaw.layoutText(svg, g.label || g.problem_statement,
      { x: W * 0.13, y: H * 0.23, w: W * 0.74, h: H * 0.26 },
      { size: opts.tall ? 22 : 19, min: 12, fill: "#fff", weight: "700" });
    if (g.stat) {
      // the survey number: "this is known, and it is not just you"
      Jigsaw.layoutText(svg, g.stat,
        { x: W * 0.13, y: H * 0.49, w: W * 0.74, h: H * 0.13 },
        { size: 12.5, min: 10, fill: accent, weight: "700" });
    }
    if (g.proposal) {
      // the bottom notch bites 13% into the piece, so the text stops at 85%
      txt(t("pj_proposal"), W * 0.13, H * 0.675, 10.5, accent, 700);
      Jigsaw.layoutText(svg, g.proposal,
        { x: W * 0.13, y: H * 0.69, w: W * 0.74, h: H * 0.16 },
        { size: opts.tall ? 14 : 12.5, min: 9.5, fill: "#D6DCE8", weight: "600" });
    }
    return svg;
  }

  function fillProblems() {
    const host = $("problemList");
    if (!host) return;
    const groups = (Store.state.groups || []).filter(g => g.id !== "GX");
    if (!groups.length) {
      host.className = "problems";
      host.innerHTML = `<p class="sub" style="text-align:center">${escapeHtml(t("pj_waiting_gaps"))}</p>`;
      return;
    }
    host.className = "problems pieces";
    const cols = groups.length <= 3 ? groups.length : groups.length === 4 ? 2 : groups.length <= 6 ? 3 : 4;
    const rows = Math.ceil(groups.length / cols);
    host.style.setProperty("--cols", cols);
    host.replaceChildren();
    /* Size each piece explicitly from the measured grid. Relying on the CSS
       percent-height chain let a wide piece grow past its row and get
       clipped; a pixel size that fits both the column and the row cannot. */
    const gapX = host.clientWidth * 0.01, gapY = host.clientHeight * 0.01;
    const cellW = (host.clientWidth - gapX * (cols - 1)) / cols;
    const cellH = (host.clientHeight - gapY * (rows - 1)) / rows;
    const AR = (440 + 16) / (260 + 16);                    // nominal piece incl. margin
    const pw = Math.min(cellW, cellH * AR), ph = pw / AR;
    groups.forEach((g, i) => {
      const cell = document.createElement("div");
      cell.className = "problem-piece";
      const svg = problemPiece(g, i, { blind: true });
      svg.setAttribute("width", Math.floor(pw)); svg.setAttribute("height", Math.floor(ph));
      svg.style.width = Math.floor(pw) + "px"; svg.style.height = Math.floor(ph) + "px";
      cell.appendChild(svg);
      host.appendChild(cell);
    });
  }

  /* ---- slide: one gap, WHY or HOW — blind while collecting, revealed on command ---- */
  function buildGap(el, slide) {
    el.innerHTML = `
      <div class="slide-head"><h2 id="gapH"></h2><p class="sub" id="gapSub"></p></div>
      <div class="slide-body"><div id="gapBody" style="height:100%;position:relative"></div></div>`;
    gapLayout = null;
  }
  let gapLayout = null;

  function fillGap(slide) {
    const st = Store.state, g = gapById(slide.gapId), i = gapIndex(slide.gapId);
    const ph = st.room ? st.room.phase : "";
    const isWhy = slide.phase === "why";
    const revealed = ph === "why_reveal" || ph === "how_reveal";
    const isOverall = slide.gapId === Slides.OVERALL;
    setText("gapH", isOverall ? t("pj_overall") : (g ? g.label : slide.gapId));
    setText("gapSub", !g ? t("pj_waiting_gaps")
      : isWhy ? (revealed ? t("pj_why_revealed") : t("pj_why_blind"))
              : (revealed ? t("pj_how_revealed") : t("pj_how_blind")));
    if (!g) return;
    const all = st.solutions.filter(x => x.group_id === g.id);
    const causes = all.filter(x => x.kind === "cause");
    const works  = all.filter(x => x.kind === "works");
    const fixes  = all.filter(x => x.kind === "asset" || x.kind === "idea");
    const live   = isWhy ? causes.concat(works) : fixes;
    const want = (isWhy ? "why" : "how") + ":" + (revealed ? "r" : "b") + ":" + g.id;
    const body = $("gapBody");
    if (gapLayout !== want) {
      gapLayout = want;
      if (isWhy && !revealed) {
        body.innerHTML = `<div class="react-blind">
          <div class="piece" id="gapPiece"></div>
          <div class="count"><div class="n" id="rN">0</div><div class="l">${escapeHtml(t("pj_answers"))}</div>
            <div class="split" id="rSplit"></div></div></div>`;
      } else if (isWhy && revealed) {
        /* causes on one side; on the other, people from sites where this
           already works and what makes it work — the room's proof it can be done */
        body.innerHTML = `<div class="react-reveal">
          <div class="piece" id="gapPiece"></div>
          <div class="col causes"><h3>${escapeHtml(t("pj_causes"))} <span id="cN"></span></h3><div class="board" id="boardCauses"></div></div>
          <div class="col works"><h3>${escapeHtml(t("pj_works"))} <span id="wN"></span></h3><div class="board" id="boardWorks"></div></div></div>`;
      } else if (!isWhy && !revealed) {
        /* HOW, collecting: the causes just revealed stay on screen as
           context; the answers being written are only a count */
        body.innerHTML = `<div class="react-reveal">
          <div class="piece" id="gapPiece"></div>
          <div class="col causes"><h3>${escapeHtml(t("pj_causes"))} <span id="cN"></span></h3><div class="board" id="boardCauses"></div></div>
          <div class="count" style="align-self:center;text-align:center"><div class="n" id="rN" style="font-size:clamp(60px,9vw,180px);font-weight:800;line-height:1">0</div>
            <div class="l" style="color:#9BA6BC;font-size:clamp(16px,1.7vw,28px)">${escapeHtml(t("pj_answers"))}</div><div class="split" id="rSplit" style="display:flex;gap:2vw;justify-content:center;margin-top:2vh;font-size:clamp(13px,1.3vw,22px);color:#7D879C"></div></div></div>`;
      } else {
        body.innerHTML = `<div class="react-reveal">
          <div class="piece" id="gapPiece"></div>
          <div class="col causes"><h3>${escapeHtml(t("pj_causes"))} <span id="cN"></span></h3><div class="board" id="boardCauses"></div></div>
          <div class="col fixes"><h3>${escapeHtml(t("pj_solutions"))} <span id="fN"></span></h3><div class="board" id="boardFixes"></div></div></div>`;
      }
      if (!isOverall) $("gapPiece").appendChild(problemPiece(g, i, { tall: true, blind: true }));
      else $("gapPiece").innerHTML = `<div style="color:#9BA6BC;font-size:clamp(16px,1.8vw,30px);line-height:1.5;padding:2vw">${escapeHtml(t("overall_sub"))}</div>`;
    }
    if (!revealed) {
      setText("rN", live.length);
      $("rSplit").innerHTML = cfg.disciplines.map(d => {
        const n = live.filter(x => x.discipline === d.id).length;
        return `<div style="color:${(cfg.colors[d.id]||cfg.colors.fallback).base}"><b style="display:block;font-size:1.5em">${n}</b>${escapeHtml(d.label)}</div>`;
      }).join("");
    }
    if ($("boardCauses")) { setText("cN", causes.length); renderBoard(causes, "cause", $("boardCauses")); }
    if ($("boardWorks"))  { setText("wN", works.length);  renderBoard(works, "works", $("boardWorks")); }
    if ($("boardFixes"))  { setText("fN", fixes.length);  renderBoard(fixes, "fix", $("boardFixes")); }
  }

  /* ---- slide: closing ---- */
  function buildClosing(el) {
    el.innerHTML = `
      <div class="closing">
        <div>
          <div class="big">${escapeHtml(t("pj_closing"))}</div>
          <div class="sub" id="closeStats"></div>
          ${cfg.signupUrl ? `<div class="signup"><div class="qr" id="signupQr"></div>
             <div class="l">${escapeHtml(t("pj_signup"))}</div></div>` : ""}
        </div>
      </div>`;
    if (cfg.signupUrl) {
      try { $("signupQr").innerHTML = QRCode.toSVG(cfg.signupUrl, { level: "M", quietZone: 1 }); } catch (e) {}
    }
  }

  /* ------------------------------------------------------------------------
     THE BOARD — post-its on a loose grid. A note may carry a second line
     (its how / why), drawn smaller beneath the main text.
     ---------------------------------------------------------------------- */
  const actorLabel = id => ((cfg.actors || []).find(a => a.id === id) || {}).label || "";
  function noteText(n, kind) {
    // a WHY note reads as the sentence the blanks made: when · who does · because
    if (n.kind === "cause" || n.kind === "works") {
      const who = actorLabel(n.actor);
      const main = (n.context ? "เมื่อ" + n.context + " " : "") + (who ? who : "") +
                   (n.kind === "cause" ? "มักจะ" : "จะ") + n.body;
      return { main, sub: n.reason ? "เนื่องจาก" + n.reason : "" };
    }
    // something that already exists here is marked, so the room can see how
    // much of the answer is "use what we have" versus "build something new"
    const main = (n.kind === "asset" ? "✓ " + t("pj_asset_mark") + " · " : "") + n.body;
    return { main, sub: n.reason || "" };
  }

  function renderBoard(notes, kind, host) {
    const board = host || $("board");
    if (!board) return;
    const W = board.clientWidth, H = board.clientHeight;
    if (W < 50 || H < 50) return;

    if (viewMode === "cloud" && !host) {
      WordCloud.render(board, notes, { max: 130 });
      if (notes.length) {
        const chip = document.createElement("div");
        chip.className = "more-chip";
        chip.textContent = notes.length;
        board.appendChild(chip);
      }
      return;
    }

    const MIN_NOTE_W = 168;
    const target = Math.max(1, notes.length);
    let cols = Math.ceil(Math.sqrt(target * (W / H) * 1.25));
    cols = Math.min(Math.max(cols, host ? 1 : 2), 11, Math.max(host ? 1 : 2, Math.floor(W / MIN_NOTE_W)));
    let rows = Math.ceil(target / cols);
    const maxRows = Math.max(1, Math.floor(H / 104));
    let capacity = cols * Math.min(rows, maxRows);
    if (rows > maxRows) rows = maxRows;

    const shown = notes.slice(-capacity);
    const hidden = notes.length - shown.length;

    const capW = notes.length <= 8 ? 430 : notes.length <= 24 ? 330 : 300;
    const capH = notes.length <= 8 ? 270 : notes.length <= 24 ? 210 : 190;
    const cw = W / cols, ch = H / rows;
    const pw = Math.min(cw * 0.86, capW), ph = Math.min(ch * 0.82, capH);
    const cellW = Math.min(cw, pw / 0.86);
    const cellH = Math.min(ch, ph / 0.82);
    const originX = (W - cols * cellW) / 2;
    const originY = (H - Math.ceil(shown.length / cols) * cellH) / 2;

    board.replaceChildren();
    shown.forEach((n, i) => {
      const r = Math.floor(i / cols), c = i % cols;
      const holder = document.createElement("div");
      holder.className = "note-piece";
      const tilt = (hash(n.id) % 700) / 100 - 3.5;
      holder.style.setProperty("--tilt", tilt + "deg");
      const { svg, ink, pad } = Jigsaw.postitSVG({
        discipline: n.discipline, role: n.role, width: pw, height: ph
      });
      holder.style.left = (originX + c * cellW + (cellW - pw) / 2 - pad) + "px";
      holder.style.top  = (originY + r * cellH + (cellH - ph) / 2 - pad) + "px";
      holder.style.animationDelay = Math.min(i * 12, 500) + "ms";

      const { main, sub } = noteText(n, kind);
      if (sub) {
        Jigsaw.layoutText(svg, main,
          { x: pw * 0.08, y: ph * 0.25, w: pw * 0.84, h: ph * 0.38 },
          { size: Math.max(11, Math.round(ph/9)), min: 9, fill: ink, weight: "700" });
        Jigsaw.layoutText(svg, sub,
          { x: pw * 0.08, y: ph * 0.65, w: pw * 0.84, h: ph * 0.3 },
          { size: Math.max(10, Math.round(ph/11.5)), min: 8, fill: ink, weight: "500" });
      } else {
        Jigsaw.layoutText(svg, main,
          { x: pw * 0.08, y: ph * 0.2, w: pw * 0.84, h: ph * 0.7 },
          { size: Math.max(11, Math.round(ph/8.4)), min: 9, fill: ink, weight: "600" });
      }
      holder.appendChild(svg);
      board.appendChild(holder);
    });

    if (hidden > 0) {
      const chip = document.createElement("div");
      chip.className = "more-chip";
      chip.textContent = "+ " + hidden;
      board.appendChild(chip);
    }
  }

  function hash(s) {
    let h = 0;
    for (let i = 0; i < String(s).length; i++) h = (h * 31 + String(s).charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  /* ---- keep whatever is on screen up to date ---- */
  function refreshSlide() {
    const s = SLIDES[current];
    if (!s) return;
    const st = Store.state;
    $("liveCount").lastElementChild.textContent = (st.participants || []).length + " " + t("pj_in_room");

    if (s.key === "title") { const n = $("joinN"); if (n) n.textContent = (st.participants || []).length; }
    if (s.key === "who") fillWho();
    if (s.key === "evidence") fillProblems();
    if (s.gapId) fillGap(s);
    if (s.key === "closing") {
      const el = $("closeStats");
      if (el) {
        const c = st.solutions.filter(x => x.kind === "cause").length;
        const w = st.solutions.filter(x => x.kind === "works").length;
        const a = st.solutions.filter(x => x.kind === "asset").length;
        const i = st.solutions.filter(x => x.kind === "idea").length;
        const both = (st.groups || []).filter(g => g.id !== Slides.OVERALL).filter(g => {
          const ds = new Set(st.solutions.filter(x => x.group_id === g.id).map(x => x.discipline));
          return ds.size >= 2;
        }).length;
        el.textContent = t("pj_stats", { c, w, a, i, g: both });
      }
    }
  }

  function setText(id, v) { const e = $(id); if (e) e.textContent = v; }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g,
      c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  /* ---- toolbar ---- */
  $("tView").addEventListener("click", () => {
    viewMode = viewMode === "wall" ? "cloud" : "wall";
    $("tView").textContent = viewMode === "wall" ? t("pj_word_cloud") : t("pj_wall");
    $("tView").setAttribute("aria-pressed", String(viewMode === "cloud"));
    refreshSlide();
  });
  $("tFull").addEventListener("click", () => {
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });

  /* ---- arrow keys drive the ROOM, not just this screen (see slides.js) ---- */
  const TOKEN_KEY = "missingpiece.token";
  let driveToken = null;
  function askForToken() {
    let tk = null;
    try { tk = localStorage.getItem(TOKEN_KEY); } catch {}
    if (!tk) { tk = prompt("Control password (or leave blank and use the control panel):"); if (tk) tk = tk.trim(); }
    return tk || null;
  }
  async function driveTo(i) {
    i = Math.max(0, Math.min(SLIDES.length - 1, i));
    if (i === current) return;
    if (!driveToken) driveToken = askForToken();
    if (!driveToken) return;
    show(i);
    try {
      await Store.control(driveToken, Slides.changesFor(SLIDES, i));
      try { localStorage.setItem(TOKEN_KEY, driveToken); } catch {}
    } catch (e) {
      if (/token/i.test(e.message || "")) { driveToken = null; try { localStorage.removeItem(TOKEN_KEY); } catch {} alert("Wrong password."); }
      else alert("Couldn't move the room: " + (e.message || e));
      if (Store.state.room) show(Store.state.room.current_slide | 0);
    }
  }
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "PageDown") driveTo(current + 1);
    if (e.key === "ArrowLeft"  || e.key === "PageUp")   driveTo(current - 1);
    if (e.key === "w") $("tView").click();
    if (e.key === "f") $("tFull").click();
  });

  let resizeT;
  addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { gapLayout = null; refreshSlide(); }, 180); });

  $("cornerCode").innerHTML =
    `<span>${escapeHtml(cfg.joinUrl.replace(/^https?:\/\//, ""))}</span><b>${escapeHtml(cfg.roomCode)}</b>`;
  $("cornerCode").title = "build " + (window.BUILD || "?");

  /* ---- connect and follow the facilitator ---- */
  (async function () {
    try {
      await Store.init();
      Store.onChange((what, st) => {
        if (what === "offline") { $("offline").classList.remove("hidden"); return; }
        $("offline").classList.add("hidden");
        if (what === "room" && st.room) {
          const target = Math.max(0, Math.min(SLIDES.length - 1, st.room.current_slide | 0));
          if (target !== current) { show(target); return; }
        }
        refreshSlide();
      });
      await Store.startWatching({ intervalMs: 1200 });
      setInterval(async () => {
        try { Store.state.participants = await Store.listParticipants(); refreshSlide(); } catch (e) {}
      }, 5000);
      Store.state.participants = await Store.listParticipants();
      show(Store.state.room ? (Store.state.room.current_slide | 0) : 0);
    } catch (e) {
      document.body.innerHTML =
        `<div style="display:grid;place-items:center;height:100vh;text-align:center;padding:40px">
          <div><div style="font-size:30px;font-weight:700;margin-bottom:14px">เชื่อมต่อข้อมูลไม่ได้</div>
          <div style="color:#9BA6BC;font-size:18px;max-width:60ch;line-height:1.5">${escapeHtml(e.message || String(e))}</div></div>
        </div>`;
    }
  })();
})();
</script>
</body>
