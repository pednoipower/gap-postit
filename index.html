<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<title>Join — The Missing Piece</title>
<link rel="stylesheet" href="assets/theme.css?v=202609220831">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧩</text></svg>">
</head>
<body class="participant">
<div class="wrap">

  <div class="masthead">
    <h1 id="title">The Missing Piece</h1>
    <p id="subtitle">Finding the gaps between nephrology and palliative care</p>
  </div>

  <p class="hint" style="margin:-6px 0 14px" id="anonNote"></p>

  <div id="statusBox"></div>

  <div class="card">
    <label class="field">
      <span class="lbl" id="lblTeam"></span>
      <div class="choices two" id="disciplines"></div>
    </label>

    <label class="field">
      <span class="lbl" id="lblRole"></span>
      <div class="choices wrap-auto" id="roles"></div>
    </label>

    <label class="field hidden" style="margin-bottom:6px" id="settingField">
      <span class="lbl" id="lblSetting"></span>
      <div class="choices wrap-auto" id="settings"></div>
    </label>
  </div>

  <div class="sticky-foot">
    <button class="btn" id="go" disabled></button>
  </div>
  <p class="hint center" style="opacity:.5;font-size:11px;margin:8px 0 4px" id="buildLine"></p>
</div>

<script src="assets/version.js?v=202609220831"></script>
<script src="assets/config.js?v=202609220831"></script>
<script src="assets/strings.js?v=202609220831"></script>
<script src="assets/store-supabase.js?v=202609220831"></script>
<script src="assets/store-local.js?v=202609220831"></script>
<script src="assets/store.js?v=202609220831"></script>
<script>
(function () {
  "use strict";
  const cfg = window.CONFIG;
  const $ = id => document.getElementById(id);
  const t = window.T.t;
  $("buildLine").textContent = "build " + (window.BUILD || "?");

  document.title = cfg.workshopTitle;
  $("lblTeam").textContent = t("join_team");
  $("lblRole").textContent = t("join_role");
  $("lblSetting").textContent = t("join_setting");
  $("anonNote").textContent = t("join_anon");
  $("title").textContent = cfg.workshopTitle;
  $("subtitle").textContent = cfg.workshopSubtitle;

  // Discipline colours come from config so there is one place to change them
  const root = document.documentElement.style;
  if (cfg.colors.nephro)     { root.setProperty("--nephro", cfg.colors.nephro.base); }
  if (cfg.colors.palliative) { root.setProperty("--pall",   cfg.colors.palliative.base); }

  const askSetting = (cfg.settings || []).length > 0;
  const picked = { discipline: null, role: null, setting: null };

  function buildChoices(host, items, key, withDot) {
    host.replaceChildren();
    for (const item of items) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "choice";
      b.setAttribute("aria-pressed", "false");
      if (key === "discipline") b.dataset.discipline = item.id;
      if (withDot) {
        const d = document.createElement("span");
        d.className = "dot";
        b.appendChild(d);
      }
      b.appendChild(document.createTextNode(item.label));
      b.addEventListener("click", () => {
        picked[key] = item.id;
        [...host.children].forEach(c => c.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        refresh();
      });
      host.appendChild(b);
    }
  }

  buildChoices($("disciplines"), cfg.disciplines, "discipline", true);
  buildChoices($("roles"), cfg.roles, "role", false);
  if (askSetting) {
    buildChoices($("settings"), cfg.settings, "setting", false);
    $("settingField").classList.remove("hidden");
  }

  function refresh() {
    const ready = picked.discipline && picked.role && (!askSetting || picked.setting);
    $("go").disabled = !ready || !window.__connected;
    $("go").textContent = !window.__connected ? t("join_connecting")
      : ready ? t("join_go") : t("join_pick");
  }
  refresh();

  function status(kind, text) {
    $("statusBox").innerHTML =
      `<div class="status ${kind}"><span class="pip"></span><span>${text}</span></div>`;
  }

  // If they already joined on this phone, remember it and skip straight in.
  const saved = (() => {
    try { return JSON.parse(localStorage.getItem("missingpiece.me") || "null"); }
    catch { return null; }
  })();

  (async function connect() {
    status("warn", t("join_connecting"));
    try {
      const backend = await Store.init();
      window.__connected = true;
      if (saved && saved.room === cfg.roomCode) {
        status("ok", t("join_welcome"));
        location.replace("board.html");
        return;
      }
      status("ok", t("join_connected") + " " + cfg.roomCode +
             (backend === "local" ? " (local)" : ""));
      refresh();
    } catch (e) {
      window.__connected = false;
      status("bad", e.bothFailed ? t("join_fail") : t("join_fail") + " (" + (e.message || e) + ")");
      refresh();
    }
  })();

  $("go").addEventListener("click", async () => {
    $("go").disabled = true;
    $("go").textContent = t("join_joining");
    try {
      const id = await Store.join(picked.role, picked.discipline, picked.setting);
      localStorage.setItem("missingpiece.me", JSON.stringify({
        id, role: picked.role, discipline: picked.discipline, setting: picked.setting, room: cfg.roomCode
      }));
      location.href = "board.html";
    } catch (e) {
      // Joining is only bookkeeping — never block someone from taking part
      localStorage.setItem("missingpiece.me", JSON.stringify({
        id: Store.uuid(), role: picked.role, discipline: picked.discipline,
        setting: picked.setting, room: cfg.roomCode, unregistered: true
      }));
      location.href = "board.html";
    }
  });
})();
</script>
</body>
</html>
