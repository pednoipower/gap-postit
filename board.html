<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<title>ชิ้นส่วนที่หายไป</title>
<link rel="stylesheet" href="assets/theme.css?v=202609230807">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='5' width='22' height='22' rx='2' fill='%23F2E6B8'/><rect x='5' y='5' width='22' height='5' rx='2' fill='%23D4A020'/></svg>">
<style>
  .stat-line { font-size: 14px; color: var(--gold-700); font-weight: 600; line-height: 1.5; margin: 0 0 12px; }
  .stat-line.practice { color: var(--text-dim); font-weight: 600; }
  .stance { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stance .choice { text-align: center; padding: 14px 10px; line-height: 1.3; }
  .stance .choice[data-stance="asset"][aria-pressed="true"] { --pick: var(--green-500); }
  .stance .choice[data-stance="idea"][aria-pressed="true"]  { --pick: var(--primary); }
  .stance .choice[data-stance="cause"][aria-pressed="true"] { --pick: var(--gold-700); }
  .stance .choice[data-stance="works"][aria-pressed="true"] { --pick: var(--green-500); }
  .field textarea.note { min-height: 84px; }
  .field textarea.note.blank { min-height: 58px; }
  .field .lbl.conn { font-size: 17px; font-weight: 700; }
  .sub-hint { display: block; font-size: 13.5px; color: var(--text); line-height: 1.5; margin: -4px 0 4px; }
  .cues { margin: 0 0 9px; padding-left: 18px; font-size: 13px; color: var(--text-dim); line-height: 1.55; }
  /* one finished sentence, in the same grammar, kept on screen while they
     write their own: people copy an example far more reliably than they
     follow an instruction */
  .worked { background: #fdf8ec; border: 1px solid #ecdcb0;
            border-radius: 0 var(--r-leaf) 0 var(--r-leaf);
            padding: 9px 12px; margin: 0 0 13px; }
  .worked summary { font-size: 14px; font-weight: 600; color: var(--gold-700); cursor: pointer;
                    min-height: 24px; display: list-item; }
  .worked p { margin: 8px 0 0; font-size: 14px; line-height: 1.6; color: var(--text); }
  .worked p b { font-weight: 700; }
  .nudge { margin: 7px 0 0; font-size: 14px; line-height: 1.6; color: var(--gold-700);
           background: #fdf8ec; border-radius: var(--r-sm); padding: 9px 12px; }
  .cues li { margin: 0 0 2px; }
  /* the fixed start of the sentence: the gap, then "because" */
  .opening { font-size: 16px; font-weight: 700; line-height: 1.5; margin: 0 0 12px; padding: 10px 12px;
    background: var(--paper-2); border-radius: var(--r-sm); }
  .opening .gap { color: var(--text-dim); font-weight: 600; }
  /* the sentence assembling itself as they type */
  .preview { border: 2px dashed var(--edge); border-radius: var(--r-md); padding: 11px 13px; margin-top: 4px; }
  .preview .k { font-size: 12.5px; color: var(--text-dim); font-weight: 600; margin-bottom: 4px; }
  .preview .v { font-size: 15.5px; line-height: 1.55; }
  .preview .v .b { color: var(--text-dim); }
  .preview .v .f { font-weight: 700; }
  .field .lbl { font-size: 15.5px; }
  .why-note { font-size: 13.5px; color: var(--text-dim); line-height: 1.5; margin: 0 0 12px; }
  /* where am I in the session */
  .steps { display:flex; gap:6px; margin:2px 0 14px; }
  .steps span { flex:1; text-align:center; font-size:12.5px; font-weight:600; color:var(--text-dim);
    padding:7px 4px; border-radius:8px; background:var(--paper-2); line-height:1.3; }
  .steps span[aria-current="step"] { background:var(--heading); color:#fff; }
  .steps span.done { color:var(--green-600); background:var(--green-50); }
  .gap-row { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--edge); }
  .gap-row:first-child { border-top:0; padding-top:0; }
  .gap-row .g { flex:none; width:32px; height:32px; border-radius:0 var(--r-md) 0 var(--r-md); display:grid; place-items:center;
    font-size:12px; font-weight:700; color:var(--green-900); }
  .gap-row b { display:block; font-size:15.5px; line-height:1.4; }
  .gap-row small { display:block; font-size:13.5px; color:var(--text-dim); line-height:1.5; margin-top:2px; }
  .gap-row small.st { color:var(--gold-700); font-weight:600; }
</style>
</head>
<body class="participant">
<div class="wrap">

  <div class="steps" id="steps" aria-label="ขั้นตอน"></div>

  <div class="masthead">
    <h1 id="promptTitle"></h1>
    <p id="promptSub"></p>
  </div>

  <div id="statusBox"></div>

  <!-- shown whenever there is nothing to type -->
  <div class="card center" id="waitCard">
    <p class="hint" style="margin:6px 0 0" id="waitText"></p>
  </div>

  <!-- the gaps, readable on the phone while the projector shows them -->
  <div class="card hidden" id="gapsCard">
    <p class="hint" style="margin:0 0 12px" id="gapsIntro"></p>
    <div id="gapsList"></div>
  </div>

  <!-- WHY: what in the system makes this happen here -->
  <div class="card hidden" id="whyCard">
    <p class="stat-line" id="whyStat"></p>
    <label class="field">
      <span class="lbl" id="siteLbl"></span>
      <div class="stance">
        <button type="button" class="choice" data-stance="cause" aria-pressed="false" id="stHas"></button>
        <button type="button" class="choice" data-stance="works" aria-pressed="false" id="stHasnot"></button>
      </div>
    </label>
    <div id="whyFields" class="hidden">
      <p class="why-note" id="whyLead"></p>
      <p class="opening" id="opening"></p>
      <details class="worked" id="worked">
        <summary id="workedLbl"></summary>
        <p id="workedText"></p>
      </details>
      <label class="field">
        <span class="lbl" id="whoLbl"></span>
        <div class="choices wrap-auto" id="whoChoices"></div>
      </label>
      <label class="field">
        <span class="lbl conn" id="doesLbl"></span>
        <textarea class="note blank" id="wBody" maxlength="400" rows="2" autocomplete="off" autocorrect="on"></textarea>
      </label>
      <label class="field">
        <span class="lbl conn" id="situLbl"></span>
        <span class="sub-hint" id="situSub"></span>
        <ul class="cues" id="situCues"><li id="cueTime"></li><li id="cueTask"></li><li id="cueRes"></li><li id="cueWho"></li></ul>
        <textarea class="note blank" id="wWhen" maxlength="400" rows="3" autocomplete="off" autocorrect="on"></textarea>
        <p class="nudge hidden" id="situNudge"></p>
      </label>
      <label class="field">
        <span class="lbl conn" id="becauseLbl"></span>
        <textarea class="note blank" id="wWhy" maxlength="400" rows="2" autocomplete="off" autocorrect="on"></textarea>
      </label>
      <div class="preview" id="preview"><div class="k" id="previewK"></div><div class="v" id="previewV"></div></div>
      <p class="why-note" style="margin:10px 0 0" id="whyNote"></p>
    </div>
  </div>

  <!-- HOW: something that exists here / something new, and why it would work -->
  <div class="card hidden" id="howCard">
    <label class="field">
      <span class="lbl" id="stanceLbl"></span>
      <div class="stance">
        <button type="button" class="choice" data-stance="asset" aria-pressed="false" id="stAsset"></button>
        <button type="button" class="choice" data-stance="idea"  aria-pressed="false" id="stIdea"></button>
      </div>
    </label>
    <div id="howFields" class="hidden">
      <label class="field">
        <span class="lbl" id="hWhatLbl"></span>
        <textarea class="note" id="hWhat" maxlength="400" rows="3" autocomplete="off" autocorrect="on"></textarea>
      </label>
      <label class="field" style="margin-bottom:0">
        <span class="lbl" id="hWhyLbl"></span>
        <textarea class="note" id="hWhy" maxlength="400" rows="3" autocomplete="off" autocorrect="on"></textarea>
      </label>
    </div>
  </div>

  <div class="mine hidden" id="mineBox">
    <h3 id="mineHead"></h3>
    <div id="mineList"></div>
  </div>

  <div class="sticky-foot hidden" id="foot">
    <div class="foot-msg" id="footMsg" aria-live="polite"></div>
    <button class="btn" id="send" disabled></button>
  </div>
  <p class="hint center" style="opacity:.5;font-size:11px;margin:8px 0 4px" id="buildLine"></p>
</div>

<script src="assets/version.js?v=202609230807"></script>
<script src="assets/config.js?v=202609230807"></script>
<script src="assets/highlight.js?v=202609230807"></script>
<script src="assets/strings.js?v=202609230807"></script>
<script src="assets/store-supabase.js?v=202609230807"></script>
<script src="assets/store-local.js?v=202609230807"></script>
<script src="assets/store.js?v=202609230807"></script>
<script>
(function () {
  "use strict";
  const cfg = window.CONFIG;
  const $ = id => document.getElementById(id);
  const t = window.T.t;
  $("buildLine").textContent = "build " + (window.BUILD || "?");

  const me = (() => {
    try { return JSON.parse(localStorage.getItem("missingpiece.me") || "null"); }
    catch { return null; }
  })();
  if (!me || me.room !== cfg.roomCode) { location.replace("index.html"); return; }

  const root = document.documentElement.style;
  if (cfg.colors.nephro)     root.setProperty("--nephro", cfg.colors.nephro.base);
  if (cfg.colors.palliative) root.setProperty("--pall",   cfg.colors.palliative.base);
  const myColor = (cfg.colors[me.discipline] || cfg.colors.fallback).base;
  const OVERALL = "GX";
  const PALETTE = ["#a9cdb9","#e6cb74","#76ad90","#d5e7dd","#c9a227","#a9cdb9","#e6cb74","#76ad90"];

  let room = null, groups = [];
  let stance = null;             // how: "asset" | "idea"
  let site = null;               // why: "cause" (gap exists here) | "works" (it works here)
  let actor = null;              // why: the WHO tap
  let lastSentAt = 0, sending = false;
  const mine = [];               // this person's own notes, echoed back

  const max = cfg.maxCharacters || 200;
  const perRound = cfg.maxPerPersonPerPrompt || 5;

  /* ---- static labels ---- */
  $("siteLbl").textContent = t("why_site");
  $("stHas").textContent = t("why_has");
  $("stHasnot").textContent = t("why_hasnot");
  $("whyNote").textContent = t("why_note");
  $("stHas").addEventListener("click", () => setSite("cause"));
  $("stHasnot").addEventListener("click", () => setSite("works"));
  $("whoLbl").textContent = t("who_lbl");
  $("situLbl").textContent = t("situ_lbl");
  $("cueTime").textContent = t("situ_cue_time");
  $("cueTask").textContent = t("situ_cue_task");
  $("cueRes").textContent = t("situ_cue_res");
  $("cueWho").textContent = t("situ_cue_who");
  $("becauseLbl").textContent = t("because_lbl");
  $("previewK").textContent = t("preview_lbl");
  /* the warm-up round is about a meeting that overruns, so it carries its
     own examples; a "_p" string is used when there is one, otherwise the
     clinical one */
  const hint = k => (isPractice() && window.T.S[k + "_p"]) ? t(k + "_p") : t(k);
  $("wWhen").placeholder = t("situ_hint");

  /* The sentence, assembled from the blanks. Blank parts show as ___ so the
     person can see the shape of what they are building. */
  function renderPreview() {
    const g = currentGap();
    if (!g || !site) return;
    const f = v => v ? `<span class="f">${escapeHtml(v)}</span>` : `<span class="b">______</span>`;
    const who = actorLabel(actor);
    /* [gap] — ยังเจอ/ไม่ค่อยเจอในงานของเรา: [who] มักจะ [response] เมื่อ
       [situation] เพราะ [reason]. The actor and what they do come first
       because that is the part people can already say; the situation is then
       a question about something concrete they have just written down. */
    $("previewV").innerHTML =
      `<span class="b">${escapeHtml(g.label)} — ${escapeHtml(t(site === "cause" ? "open_cause" : "open_works"))}</span> ` +
      `${f(who)} ${t("conn_does")}${f($("wBody").value.trim())} ` +
      `${t("conn_when")}${f($("wWhen").value.trim())} ` +
      `${t("conn_because")}${f($("wWhy").value.trim())}`;
  }
  function escapeHtml(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g,
      c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function setSite(v) {
    site = v;
    $("stHas").setAttribute("aria-pressed", String(v === "cause"));
    $("stHasnot").setAttribute("aria-pressed", String(v === "works"));
    $("whyFields").classList.remove("hidden");
    $("whyLead").textContent = t(v === "cause" ? "why_lead" : "works_lead");
    const g = currentGap();
    $("opening").innerHTML = `<span class="gap">${g ? Highlight.html(g.label, escapeHtml) : ""}</span> ${escapeHtml(t(v === "cause" ? "open_cause" : "open_works"))}`;
    $("situSub").textContent = t(v === "cause" ? "situ_sub" : "situ_sub_works");
    $("doesLbl").textContent = t(v === "cause" ? "does_lbl" : "does_works_lbl");
    $("wWhen").placeholder = hint(v === "cause" ? "situ_hint" : "situ_hint_works");
    $("wBody").placeholder = hint(v === "cause" ? "does_hint" : "does_works_hint");
    $("wWhy").placeholder  = hint(v === "cause" ? "because_hint" : "because_works_hint");
    /* The example is the real instruction. It is in the same grammar as the
       blanks, it is already filled in, and it stays on screen while they
       write — open by default in the practice round, where learning the
       shape is the point, and folded away after that. */
    const wk = isPractice()
      ? (v === "cause" ? "worked_cause_p" : "worked_works_p")
      : (v === "cause" ? "worked_cause"   : "worked_works");
    $("workedLbl").textContent = t("worked_lbl");
    $("workedText").innerHTML = t(wk);
    $("worked").open = isPractice();
    chips($("whoChoices"), actorsNow(), id => { actor = id; renderPreview(); }, actor);
    renderPreview();
    refreshSend();
  }
  /* ---- choice chips ---- */
  function chips(host, items, onPick, current) {
    host.replaceChildren();
    for (const it of items) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "choice";
      b.dataset.id = it.id;
      b.setAttribute("aria-pressed", String(current === it.id));
      b.style.setProperty("--pick", myColor);
      b.textContent = it.label;
      b.addEventListener("click", () => {
        onPick(it.id);
        [...host.children].forEach(c => c.setAttribute("aria-pressed", String(c.dataset.id === it.id)));
        refreshSend();
      });
      host.appendChild(b);
    }
  }
  $("stanceLbl").textContent = t("how_pick");
  $("stAsset").textContent = t("how_asset");
  $("stIdea").textContent = t("how_new");

  /* Feedback goes next to the send button, where the person is looking.
     Connection problems also go at the top, where they stay visible. */
  function status(kind, text, hide) {
    if (hide) { $("statusBox").replaceChildren(); $("footMsg").textContent = ""; $("footMsg").className = "foot-msg"; return; }
    $("footMsg").textContent = text; $("footMsg").className = "foot-msg " + kind;
    if (kind === "bad" || kind === "warn")
      $("statusBox").innerHTML = `<div class="status ${kind}"><span class="pip"></span><span>${text}</span></div>`;
  }

  /* ---- which mode are we in? ---- */
  function mode() {
    if (!room || !room.board_open || !room.spotlight_group) return "wait";
    if (room.phase === "why") return "why";
    if (room.phase === "how") return "how";
    return "wait";
  }
  const currentGap = () => groups.find(g => g.id === (room && room.spotlight_group));
  const PRACTICE = (cfg.practice && cfg.practice.id) || "G0";
  const isPractice = () => room && room.spotlight_group === PRACTICE;
  /* the warm-up round asks about a meeting, not about CKM, so it brings its
     own WHO list; both lists are searched when a note is read back */
  const actorsNow = () => (isPractice() && cfg.practice && cfg.practice.actors) || cfg.actors || [];
  const ALL_ACTORS = (cfg.actors || []).concat((cfg.practice && cfg.practice.actors) || []);
  const actorLabel = id => (ALL_ACTORS.find(a => a.id === id) || {}).label || "";
  const realGaps = () => groups.filter(g => g.id !== OVERALL && g.id !== PRACTICE);

  /* ---- step strip: gap n/N · why | how · overall ---- */
  function renderSteps() {
    const ph = room ? room.phase : "lobby";
    const gaps = realGaps();
    const spot = room && room.spotlight_group;
    const gi = gaps.findIndex(g => g.id === spot);
    const isGapPhase = ph === "why" || ph === "why_reveal" || ph === "talk" || ph === "how" || ph === "how_reveal";
    const inGap = isGapPhase && spot && spot !== OVERALL && spot !== PRACTICE;
    const inOverall = (ph === "how" || ph === "how_reveal") && spot === OVERALL;
    const isWhy = ph === "why" || ph === "why_reveal";
    const isTalk = ph === "talk";
    const items = [
      { l: t("step_gap") + (inGap && gi >= 0 ? ` ${gi + 1}/${gaps.length}` : ""), cur: ph === "evidence" || inGap, done: inOverall || ph === "closing" },
      { l: t("step_why"),  cur: inGap && isWhy, done: (inGap && !isWhy) || inOverall || ph === "closing" },
      { l: t("step_talk"), cur: inGap && isTalk, done: (inGap && !isWhy && !isTalk) || inOverall || ph === "closing" },
      { l: t("step_how"),  cur: inGap && !isWhy && !isTalk, done: inOverall || ph === "closing" },
      { l: t("step_overall"), cur: inOverall, done: ph === "closing" }
    ];
    $("steps").replaceChildren();
    items.forEach(it => {
      const e = document.createElement("span");
      e.textContent = it.l;
      if (it.cur) e.setAttribute("aria-current", "step");
      if (it.done && !it.cur) e.classList.add("done");
      $("steps").appendChild(e);
    });
    $("steps").classList.toggle("hidden", ph === "lobby" || (isGapPhase && spot === PRACTICE));
  }

  function renderGapsList() {
    const host = $("gapsList");
    host.replaceChildren();
    realGaps().forEach((g, i) => {
      const d = document.createElement("div");
      d.className = "gap-row";
      d.innerHTML = `<span class="g" style="background:${PALETTE[i % PALETTE.length]}">${g.id}</span>
        <div><b></b></div>`;
      d.querySelector("b").innerHTML = Highlight.html(g.label, escapeHtml);
      host.appendChild(d);
    });
  }

  /* ---- how: pick what kind of thing you are proposing ---- */
  $("stAsset").addEventListener("click", () => setStance("asset"));
  $("stIdea").addEventListener("click", () => setStance("idea"));
  function setStance(s) {
    stance = s;
    $("stAsset").setAttribute("aria-pressed", String(s === "asset"));
    $("stIdea").setAttribute("aria-pressed", String(s === "idea"));
    $("howFields").classList.remove("hidden");
    $("hWhatLbl").textContent = t("how_what");
    $("hWhyLbl").textContent = t("how_why");
    $("hWhat").placeholder = t(s === "asset" ? "how_what_hint_a" : "how_what_hint_n");
    $("hWhy").placeholder  = t(s === "asset" ? "how_why_hint_a"  : "how_why_hint_n");
    refreshSend();
    $("hWhat").focus({ preventScroll: true });
  }

  /* ---- what has this person sent in the current round? ---- */
  function myNotesForNow() {
    const m = mode();
    return mine.filter(n => n.groupId === room.spotlight_group &&
      (m === "why" ? (n.kind === "cause" || n.kind === "works") : m === "how" ? (n.kind === "asset" || n.kind === "idea") : false));
  }

  function fields() {
    const m = mode();
    if (m === "why") return { body: $("wBody").value.trim(), context: $("wWhen").value.trim(), reason: $("wWhy").value.trim() };
    if (m === "how") return { body: $("hWhat").value.trim(), reason: $("hWhy").value.trim() };
    return {};
  }
  function tooLong(f) { return Object.values(f).some(v => v && v.length > max); }

  function refreshSend() {
    const m = mode(), f = fields();
    const cooling = Date.now() - lastSentAt < (cfg.submitCooldownSeconds || 3) * 1000;
    const atLimit = m !== "wait" && myNotesForNow().length >= perRound;
    let missing = null, label = "";
    if (m === "why") { missing = !site ? "site" : !actor ? "who" : (!f.body || !f.context || !f.reason) ? "all" : null; label = t("send_why"); }
    if (m === "how") { missing = !stance ? "stance" : (!f.body || !f.reason) ? "both" : null; label = t("send_how"); }
    const ok = m !== "wait" && !missing && !tooLong(f) && !cooling && !sending && !atLimit;
    $("send").disabled = !ok;
    $("send").textContent =
      sending ? t("sending") :
      atLimit ? t("at_limit") :
      missing === "stance" ? t("how_pick_first") :
      missing === "site"   ? t("why_pick_first") :
      missing === "who"    ? t("pick_who_first") :
      missing === "all"    ? t("need_all") :
      missing === "both"   ? t("need_both") :
      cooling ? t("cooling") : label;
  }
  setInterval(refreshSend, 400);
  ["wWhen","wBody","wWhy","hWhat","hWhy"].forEach(id => $(id).addEventListener("input", refreshSend));
  ["wWhen","wBody","wWhy"].forEach(id => $(id).addEventListener("input", renderPreview));

  /* The one blank people answer with a category — "ไม่มีเวลา", "คนไม่พอ" —
     instead of a situation. Those are true everywhere, so they can never
     explain why the gap is here and not there. The nudge never blocks the
     send: a thin answer is still data, and an argument with the phone is
     worse than a thin answer. */
  const VAGUE = /^(ไม่มีเวลา|เวลาไม่พอ|คนไม่พอ|ขาดคน|คนน้อย|งานเยอะ|ภาระงานเยอะ|ภาระงานมาก|ยุ่ง|ไม่มีระบบ|ระบบไม่ดี|นโยบาย|ผู้บริหาร|งบไม่พอ|ไม่มีงบ)[\s.!ๆ]*$/;
  let nudgeTimer = null;
  $("wWhen").addEventListener("input", () => {
    clearTimeout(nudgeTimer);
    nudgeTimer = setTimeout(() => {
      const v = $("wWhen").value.trim();
      const thin = v.length > 0 && (v.length < 18 || VAGUE.test(v));
      $("situNudge").textContent = t("situ_nudge");
      $("situNudge").classList.toggle("hidden", !thin);
    }, 900);
  });

  /* ---- echo back what they have sent this round ---- */
  function renderMine() {
    const list = mode() === "wait" ? [] : myNotesForNow();
    $("mineBox").classList.toggle("hidden", list.length === 0);
    $("mineHead").textContent = list.length === 1 ? t("mine_one") : t("mine_n", { n: list.length });
    $("mineList").replaceChildren();
    for (const n of list) {
      const d = document.createElement("div");
      d.className = "mine-item" + (n.queued ? " pending" : "");
      const kc = (cfg.kindColors || {})[n.kind];
      d.style.setProperty("--pick", (kc && kc.base) || myColor);
      const r = document.createElement("span"); r.className = "ref"; r.textContent = n.queued ? "…" : "✓";
      const tx = document.createElement("span");
      tx.textContent = n.context
        ? `${actorLabel(n.actor)}${t("conn_does")}${n.body} ${t("conn_when")}${n.context} ${t("conn_because")}${n.reason}`
        : (n.reason ? `${n.body} — ${n.reason}` : n.body);
      d.append(r, tx);
      $("mineList").appendChild(d);
    }
  }

  /* ---- follow the facilitator ---- */
  let lastKey = null;
  function applyRoom(r) {
    room = r;
    if (!room) return;
    const m = mode();
    const g = currentGap();
    const isOverall = room.spotlight_group === OVERALL;

    /* A round is identified by what it is about — this gap's WHY or this
       gap's HOW — not by whether the board happens to be open. So a
       half-typed note survives a round closing, and is only cleared when a
       genuinely different round begins. */
    const key = (room.phase === "why" || room.phase === "why_reveal") ? "why:" + room.spotlight_group
              : (room.phase === "how" || room.phase === "how_reveal") ? "how:" + room.spotlight_group
              : room.phase;
    if (key !== lastKey) {
      lastKey = key;
      ["wWhen","wBody","wWhy","hWhat","hWhy"].forEach(id => $(id).value = "");
      stance = null; site = null; actor = null;
      $("stAsset").setAttribute("aria-pressed", "false"); $("stIdea").setAttribute("aria-pressed", "false");
      $("stHas").setAttribute("aria-pressed", "false"); $("stHasnot").setAttribute("aria-pressed", "false");
      $("howFields").classList.add("hidden"); $("whyFields").classList.add("hidden");
    }

    $("whyCard").classList.toggle("hidden", m !== "why");
    $("howCard").classList.toggle("hidden", m !== "how");
    $("waitCard").classList.toggle("hidden", m !== "wait");
    $("foot").classList.toggle("hidden", m === "wait");
    const showGaps = m === "wait" && (room.phase === "evidence" || room.phase === "why_reveal" || room.phase === "how_reveal") && realGaps().length > 0;
    $("gapsCard").classList.toggle("hidden", !showGaps);
    if (showGaps) {
      $("gapsIntro").textContent = room.phase === "evidence" ? t("gaps_intro") : room.phase === "why_reveal" ? t("reveal_why") : t("reveal_how");
      renderGapsList();
    }
    renderSteps();

    if (m === "why") {
      $("promptTitle").innerHTML = g ? Highlight.html(g.label, escapeHtml) : "";
      $("promptSub").textContent = isPractice() ? t("practice_badge") : t("why_title");
      /* Only the practice round has a line here now: the numbers behind each
         gap are the facilitator's to say out loud, not the phone's to show. */
      $("whyStat").textContent = isPractice() ? t("practice_note") : "";
      $("whyStat").classList.toggle("practice", isPractice());
    } else if (m === "how") {
      if (isOverall) $("promptTitle").textContent = t("overall_title");
      else $("promptTitle").innerHTML = g ? Highlight.html(g.label, escapeHtml) : "";
      $("promptSub").textContent = isOverall ? t("overall_sub") : t("how_title");
      /* The program's own proposal is deliberately not shown anywhere in the
         room — on screen or on the phone. People answer "how would we fix
         it" before they are told what the program had in mind, so the ideas
         that come back are theirs. It stays in config.js and the export. */
    } else {
      if (room.phase === "lobby") {
        $("promptTitle").textContent = t("wait_title"); $("promptSub").textContent = t("wait_sub");
        $("waitText").textContent = t("wait_lobby");
      } else if (room.phase === "closing") {
        $("promptTitle").textContent = cfg.workshopTitle; $("promptSub").textContent = "";
        $("waitText").textContent = t("wait_closing");
      } else if (room.phase === "talk") {
        $("promptTitle").textContent = t("talk_title");
        if (g && !isOverall) $("promptSub").innerHTML = Highlight.html(g.label, escapeHtml);
        else $("promptSub").textContent = "";
        $("waitText").textContent = t("wait_talk");
      } else if ((room.phase === "why" || room.phase === "why_reveal" || room.phase === "how" || room.phase === "how_reveal") && g) {
        if (isOverall) $("promptTitle").textContent = t("overall_title");
        else $("promptTitle").innerHTML = Highlight.html(g.label, escapeHtml);
        $("promptSub").textContent = (room.phase === "why" || room.phase === "why_reveal") ? t("why_title") : t("how_title");
        const typed = $("wBody").value.trim() || $("wWhen").value.trim() || $("wWhy").value.trim() || $("hWhat").value.trim() || $("hWhy").value.trim();
        $("waitText").textContent = t("wait_closed") + (typed ? " · " + t("draft_kept") : "");
      } else {
        $("promptTitle").textContent = cfg.workshopTitle; $("promptSub").textContent = "";
        $("waitText").textContent = t("wait_screen");
      }
    }
    renderMine();
    refreshSend();
  }

  /* ---- sending ---- */
  $("send").addEventListener("click", async () => {
    const m = mode(), f = fields();
    if (m === "wait") return;
    sending = true; refreshSend();
    const kind = m === "why" ? site : stance;             // cause|works or asset|idea
    const entry = { kind, body: f.body, reason: f.reason || null, context: f.context || null,
                    actor: m === "why" ? actor : null, groupId: room.spotlight_group, queued: false };
    try {
      const res = await Store.addSolution({ groupId: entry.groupId, kind, body: f.body, reason: f.reason || null,
        outcome: null, actor: entry.actor, context: entry.context,
        role: me.role, discipline: me.discipline, participantId: me.id });
      if (res.ok) {
        entry.queued = !!res.queued;
        mine.push(entry);
        if (m === "why") { $("wWhen").value = ""; $("wBody").value = ""; $("wWhy").value = ""; renderPreview(); }
        if (m === "how") { $("hWhat").value = ""; $("hWhy").value = ""; }
        lastSentAt = Date.now();
        status(res.queued ? "warn" : "ok", res.queued ? t("sent_queued") : t("sent_ok"));
        setTimeout(() => status(null, null, true), res.queued ? 6000 : 2600);
      } else {
        status("bad", res.error || t("sent_fail"));
      }
    } catch (e) {
      status("bad", t("sent_fail"));
    } finally {
      sending = false; renderMine(); refreshSend();
    }
  });

  /* ---- polling: the room row and the gaps, only while the page is in front ---- */
  let timer = null, lostShown = false;
  async function poll() {
    try {
      const [r, g] = await Promise.all([Store.getRoom(), Store.listGroups()]);
      if (JSON.stringify(g) !== JSON.stringify(groups)) groups = g;
      applyRoom(r);
      if (lostShown) { status(null, null, true); lostShown = false; }
    } catch (e) {
      status("warn", t("lost")); lostShown = true;
    }
  }
  function startPolling() { if (timer) return; poll(); timer = setInterval(poll, 4000); }
  function stopPolling() { clearInterval(timer); timer = null; }
  document.addEventListener("visibilitychange", () => { document.hidden ? stopPolling() : startPolling(); });

  (async function () {
    $("promptTitle").textContent = t("wait_title");
    $("promptSub").textContent = t("wait_sub");
    $("waitText").textContent = t("wait_lobby");
    try {
      await Store.init();
      await Store.flushOutbox();
      startPolling();
    } catch (e) {
      status("bad", t("join_fail"));
    }
  })();
})();
</script>
</body>
</html>
