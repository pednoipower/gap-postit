<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/theme.css">
<style>
 body{background:#0E1118;margin:0;padding:34px;font-family:ui-sans-serif,system-ui,sans-serif;color:#fff}
 h3{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:#8A94A8;margin:30px 0 16px;font-weight:600}
 .row{display:flex;gap:46px;align-items:flex-start;flex-wrap:wrap}
 .cap{font-size:12px;color:#8A94A8;margin-top:8px;text-align:center}
 .fit{position:relative;height:210px;width:520px}
 .fit .a{position:absolute;left:0;top:14px}
 .fit .b{position:absolute;left:222px;top:14px}
</style></head><body>
<script src="../assets/config.js"></script>
<script src="../assets/jigsaw.js"></script>

<h3>Concern pieces — a notch bitten out. Something is missing.</h3>
<div class="row" id="concerns"></div>

<h3>Solution pieces — a tab reaching out. Something fills a gap.</h3>
<div class="row" id="solutions"></div>

<h3>Do they actually interlock? Nephro concern + palliative solution</h3>
<div class="row"><div class="fit" id="fit"></div></div>

<h3>A problem statement, waiting for solutions to plug in</h3>
<div class="row"><div style="width:520px;height:330px" id="problem"></div></div>

<script>
function make(into, kind, disc, role, text){
  const a0 = (CONFIG.colors[disc]||CONFIG.colors.fallback).ink;
  const box=document.createElement('div');
  const {svg,pad}=Jigsaw.noteSVG({kind,discipline:disc,role,width:210,height:140});
  Jigsaw.layoutText(svg,text,{x:14,y:16,w:kind==='concern'?150:158,h:108},{size:15,fill:a0});
  box.appendChild(svg);
  const c=document.createElement('div');c.className='cap';c.textContent=disc+' · '+role;
  box.appendChild(c); into.appendChild(box); return svg;
}
const C=document.getElementById('concerns'), S=document.getElementById('solutions');
make(C,'concern','nephro','doctor','Nobody told the family that dialysis could be stopped');
make(C,'concern','palliative','nurse','I get the referral three days before the patient dies');
make(C,'concern','nephro','allied','No one to call after 5pm');

make(S,'solution','palliative','doctor','Joint clinic once a fortnight, both teams in the room');
make(S,'solution','nephro','nurse','A shared one-page handover template');
make(S,'solution','palliative','other','Named contact on every ward list');

// interlock test
const f=document.getElementById('fit');
const a=Jigsaw.noteSVG({kind:'concern',discipline:'nephro',role:'doctor',width:210,height:140});
Jigsaw.layoutText(a.svg,'Nobody told the family',{x:14,y:16,w:150,h:108},{size:15,fill:'#0E1118'});
a.svg.classList.add('a'); f.appendChild(a.svg);
const b=Jigsaw.noteSVG({kind:'solution',discipline:'palliative',role:'nurse',width:210,height:140});
Jigsaw.layoutText(b.svg,'Family meeting at day 3',{x:22,y:16,w:150,h:108},{size:15,fill:'#0E1118'});
b.svg.classList.add('b'); f.appendChild(b.svg);

// problem piece
const p=Jigsaw.problemSVG({width:430,height:250,accent:'#6E7BA8'});
Jigsaw.layoutText(p.svg,'Families are not brought into the conversation until the final days',
  {x:46,y:60,w:340,h:140},{size:25,fill:'#E8ECF6',weight:'700'});
document.getElementById('problem').appendChild(p.svg);
</script></body></html>
